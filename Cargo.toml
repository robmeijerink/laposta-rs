[package]
name = "laposta-rs"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Unofficial async client for the Laposta email marketing API"
license = "MIT"
repository = "https://github.com/robmeijerink/laposta-rs"
readme = "README.md"
keywords = ["laposta", "email", "newsletter", "api-client"]
categories = ["api-bindings", "web-programming::http-client"]
exclude = [".github"]

[features]
default = ["rustls-tls", "webhook"]
rustls-tls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
webhook = ["dep:hmac", "dep:sha2", "dep:hex"]

[dependencies]
futures-util = "0.3"
hex = { version = "0.4", optional = true }
hmac = { version = "0.12", optional = true }
reqwest = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.10", optional = true }
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["time"] }
url = { version = "2", features = ["serde"] }

[dev-dependencies]
futures = "0.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
wiremock = "0.6"

[package.metadata.docs.rs]
all-features = true
